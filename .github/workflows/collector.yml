name: Validated collector integration
on:
  push:
    paths:
      - collector.py
      - .github/workflows/collector.yml
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -u collector.py
